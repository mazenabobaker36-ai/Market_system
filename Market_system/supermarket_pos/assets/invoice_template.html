<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-size: 12px;
      margin: 0;
      padding: 10px;
      color: #111;
    }
    .receipt {
      max-width: 360px;
      margin: auto;
      border: 1px dashed #aaa;
      padding: 10px;
    }
    .title {
      text-align: center;
      margin-bottom: 10px;
    }
    .small {
      font-size: 11px;
    }
    table {
      width: 100%;
      font-size: 11px;
    }
    td, th {
      padding: 2px !important;
    }
  </style>
</head>
<body>
  <div class="receipt">
    <div class="title">
      <h5 class="mb-1">نظام السوبرماركت</h5>
      <div class="small">فاتورة / إيصال</div>
    </div>

    <div class="small mb-2">
      <div><strong>رقم الفاتورة:</strong> {invoice_no}</div>
      <div><strong>التاريخ:</strong> {created_at}</div>
      <div><strong>الكاشير:</strong> {cashier}</div>
      <div><strong>العميل:</strong> {customer}</div>
    </div>

    <table class="table table-sm table-bordered">
      <thead>
        <tr>
          <th>#</th>
          <th>الباركود</th>
          <th>الصنف</th>
          <th>الكمية</th>
          <th>السعر</th>
          <th>الإجمالي</th>
        </tr>
      </thead>
      <tbody>
        {rows}
      </tbody>
    </table>

    <div class="mt-2 small">
      <div><strong>الإجمالي:</strong> {total}</div>
      <div><strong>المدفوع:</strong> {paid}</div>
      <div><strong>الباقي:</strong> {change_amount}</div>
    </div>

    <hr>
    <div class="text-center small">شكرًا لتسوقكم معنا</div>
  </div>
</body>
</html>
