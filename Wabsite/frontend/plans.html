<body><div class="container-fluid"><div class="row"><aside class="col-lg-2 sidebar p-3 p-lg-4"><div class="brand mb-4">🛒 سوبرماركت SaaS</div><div class="text-white-50 small mb-3">لوحة الإدارة</div><nav class="nav flex-column gap-2"><a class="nav-link" href="index.html">🏠 الصفحة الرئيسية</a><a class="nav-link" href="subscriptions.html">📋 المشتركين</a><a class="nav-link active" href="plans.html">💳 خطط الاشتراك</a><a class="nav-link" href="users.html">👥 المستخدمين</a></nav></aside><main class="col-lg-10 content p-3 p-lg-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 fw-bold">خطط الاشتراك</h1><div class="text-secondary">أسعار مرنة تناسب نمو متجرك</div></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#planModal">＋ إضافة خطة</button></div><div id="message" class="alert d-none"></div><div id="plansGrid" class="row g-4"><div class="col-12 text-center text-secondary py-5">جارٍ التحميل...</div></div></main></div></div>
