name: Build Windows Setup

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'supermarket_pos/requirements.txt'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r supermarket_pos/requirements.txt
          pip install pyinstaller

      - name: Build Application with PyInstaller
        working-directory: supermarket_pos
        run: |
          pyinstaller --noconfirm supermarket_pos.spec
          pyinstaller --noconfirm --onefile --console --name updater updater/updater.py

      - name: Compile Windows Setup with Inno Setup
        run: |
          iscc installer\supermarket_pos.iss

      - name: Upload Supermarket POS Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Supermarket_POS_Setup
          path: dist_installer/Supermarket_POS_Setup.exe
          if-no-files-found: error
